# racehero.ca — Netlify config

# /api/gemini is the app's AI endpoint — a Netlify Function
# (netlify/functions/gemini.js) that holds the Gemini key server-side so
# no app build ever ships one. Key lives in the Netlify env var
# GEMINI_API_KEY (site settings); env changes need a redeploy.
[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200

# /acc is the one-minute ACC telemetry setup page (the app points SIM users
# here instead of making them paste config across devices).
[[redirects]]
  from = "/acc"
  to = "/acc.html"
  status = 200

# /link serves the RaceHero Link PC installer (the URL the app points to).
# The installer is attached to the GitHub release (binaries can't go through
# the web file upload); to ship a new version, publish a new "link-vN"
# release with the exe attached and update the URL below.
[[redirects]]
  from = "/link"
  to = "https://github.com/dmodaragamage/RaceHero-Site/releases/download/link-v2/RaceHeroLinkSetup.exe"
  status = 302

# /app is the stable "get the app" URL. Point it at the real Play listing
# once RaceHero is live on Google Play.
[[redirects]]
  from = "/app"
  to = "https://play.google.com/store"
  status = 302

# Site-wide password gate (founder directive 2026-10-26: the site goes
# dark to the public until launch). The edge function intercepts every
# path and enforces HTTP Basic Auth ONLY when the SITE_GATE_PASSWORD env
# var is set (Netlify → Site settings → Environment variables; optional
# SITE_GATE_USER, default "racehero"). While the var is unset the gate is
# inert and the site stays open — setting it + a redeploy arms the gate,
# deleting it disarms it. /api/* and /.netlify/* are excluded inside the
# function itself, so the app's endpoints (/api/gemini, /api/dev-ingest)
# are never gated.
[[edge_functions]]
  path = "/*"
  function = "site-gate"

# /api/dev-ingest is the DEV FUNNEL endpoint (founder test builds only):
# the app POSTs session data + diagnostics here during test drives, held
# in Netlify Blobs behind the DEV_FUNNEL_TOKEN env var. Inert (503)
# until that env var is set; never linked from any page. It is a v2
# function (netlify/functions/dev-ingest.mjs) that declares its own path
# via `export const config`, so it needs — and must not have — a
# redirect rule here.
