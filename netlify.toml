# racehero.ca — Netlify config

# /acc is the one-minute ACC telemetry setup page (the app points SIM users
# here instead of making them paste config across devices).
[[redirects]]
  from = "/acc"
  to = "/acc.html"
  status = 200

# /link serves the RaceHero Link PC installer (the URL the app points to).
# The installer is attached to the GitHub release (binaries can't go through
# the web file upload); to ship a new version, publish a new "link-vN"
# release with the exe attached and update the URL below.
[[redirects]]
  from = "/link"
  to = "https://github.com/dmodaragamage/RaceHero-Site/releases/download/link-v1/RaceHeroLinkSetup.exe"
  status = 302

# /app is the stable "get the app" URL. Point it at the real Play listing
# once RaceHero is live on Google Play.
[[redirects]]
  from = "/app"
  to = "https://play.google.com/store"
  status = 302
